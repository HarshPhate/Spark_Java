spring.application.name=dockerP02

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3305/Dockerdb?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port: 9090      //if you expose prot in dockerfile ,you must be need to provide here a port those gest request from postman means local port 